services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ar_connector
      POSTGRES_USER: ar_connector
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ar_connector"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # reWriteBatchedInserts: la carga de catálogos inserta cientos de miles de filas por lotes
      DB_URL: jdbc:postgresql://db:5432/ar_connector?reWriteBatchedInserts=true
      DB_USER: ar_connector
      DB_PASSWORD: changeme
      # Valores en un fichero .env local (no versionado); ver .env.example
      AR_BASE_URL: ${AR_BASE_URL:-https://au-bbva-gateway.appspot.com/timereport/api/vendors}
      AR_REQUESTOR_EMAIL: ${AR_REQUESTOR_EMAIL:-}
      # Credencial de la cuenta de servicio: fichero dentro de ./secrets (ver secrets/LEEME.md)
      AR_CREDENTIALS_FILE: ${AR_CREDENTIALS_FILE:-}
      AR_APP_ID: ${AR_APP_ID:-}
      AR_DELEGATE_TO_REQUESTOR: ${AR_DELEGATE_TO_REQUESTOR:-false}
      AR_SCOPE: ${AR_SCOPE:-email}
      AR_UPLOAD_FIELD_NAME: ${AR_UPLOAD_FIELD_NAME:-file}
      AR_GPS_CODES: ${AR_GPS_CODES:-}
      AR_GEOGRAPHIES: ${AR_GEOGRAPHIES:-}
      # Mientras no haya credenciales, AR_CLIENT=filesystem lee los catálogos de ./samples/catalogues
      AR_CLIENT: ${AR_CLIENT:-http}
      AR_LOCAL_DIR: ${AR_LOCAL_DIR:-/app/samples/catalogues}
      # El catálogo real de issues de Jira ocupa 29 MB y 270.000 filas
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx1g}
      # Usuario MANAGER inicial del panel (solo se crea la primera vez)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@arktic.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      PANEL_URL: ${PANEL_URL:-http://localhost:4200}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-ar-connector@arktic.local}
    volumes:
      - ./samples:/app/samples
      - ./secrets:/app/secrets:ro
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

  # Copias de seguridad automáticas de la base de datos (ver "Copias de seguridad" en el README)
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ar_connector
      PGUSER: ar_connector
      PGPASSWORD: changeme
      TZ: Europe/Madrid
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      # Carpeta del PC donde quedan las copias; por defecto ./backups (git la ignora)
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  db-data:
