services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ar_connector
      POSTGRES_USER: ar_connector
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ar_connector"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ar_connector
      DB_USER: ar_connector
      DB_PASSWORD: changeme
      # Credenciales de Activity Report: definir en un .env local (no versionado).
      AR_BASE_URL: ${AR_BASE_URL:-https://sandbox.example.com/timereport/api/vendors}
      AR_REQUESTOR_EMAIL: ${AR_REQUESTOR_EMAIL:-}
      AR_GPS_CODES: ${AR_GPS_CODES:-}
      AR_GEOGRAPHIES: ${AR_GEOGRAPHIES:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
