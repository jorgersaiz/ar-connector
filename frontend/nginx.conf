server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reenvía las llamadas a la API hacia el backend Java.
    # El nombre "backend" es el del servicio en docker-compose; en Azure,
    # sustituir por la URL interna del Container App del backend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rutas de Angular (SPA): cualquier ruta no encontrada cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
