spring:
  application:
    name: ar-connector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ar_connector?reWriteBatchedInserts=true}
    username: ${DB_USER:ar_connector}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona Flyway, no Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    # SMTP de Arktic para los avisos; sin host, los avisos solo se registran.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

server:
  port: 8080

# URL pública del panel, para los enlaces de los avisos
panel:
  url: ${PANEL_URL:http://localhost:4200}

notifications:
  days-before-cutoff: ${NOTIFY_DAYS_BEFORE_CUTOFF:2}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:ar-connector@arktic.local}

# Datos que el proveedor comunica a los administradores de Activity Report
# (entidad "Vendors" del documento). Si no cuadran, BBVA rechaza la llamada.
activity-report:
  base-url: ${AR_BASE_URL:https://au-bbva-gateway.appspot.com/timereport/api/vendors}
  requestor-email: ${AR_REQUESTOR_EMAIL:}
  gps-codes: ${AR_GPS_CODES:}
  geographies: ${AR_GEOGRAPHIES:}
  # http: contra BBVA, autenticado con la cuenta de servicio.
  # filesystem: lee <local-dir>/<catalogo>.csv, para desarrollar sin credenciales.
  client: ${AR_CLIENT:http}
  local-dir: ${AR_LOCAL_DIR:../samples/catalogues}
  # JSON de la cuenta de servicio que entrega BBVA. Nunca en el repositorio.
  credentials-file: ${AR_CREDENTIALS_FILE:}
  # Cabecera X-BBVA-AppId; vacío = el client_id del JSON de la credencial.
  app-id: ${AR_APP_ID:}
  # true = el token se pide delegado al usuario Requestor.
  delegate-to-requestor: ${AR_DELEGATE_TO_REQUESTOR:false}
  scope: ${AR_SCOPE:email}
  # Nombre del campo multipart con el fichero en las subidas.
  upload-field-name: ${AR_UPLOAD_FIELD_NAME:file}
  # false = no se sube nada a Activity Report (ni el job ni "Enviar ahora"); catálogos y feedback sí.
  uploads-enabled: ${AR_UPLOADS_ENABLED:true}

# Primer usuario MANAGER del panel; solo se crea si la tabla app_user está vacía.
auth:
  bootstrap:
    email: ${ADMIN_EMAIL:admin@arktic.local}
    password: ${ADMIN_PASSWORD:admin1234}

jobs:
  timezone: Europe/Madrid
  catalog-sync:
    cron: "0 0 4 * * *"   # los catálogos están disponibles a partir de las 3:00
  upload:
    cron: "0 0 13,18,21 * * *"   # todos los días: los cortes (19 y 4) pueden caer en fin de semana
  feedback-sync:
    cron: "0 30 4,10 * * *"      # el feedback está disponible a partir de las 3:00; segundo intento a media mañana
  notifications:
    cron: "0 0 9 * * *"          # avisos de huecos y rechazos, tras catálogos y feedback

logging:
  level:
    com.vendor.arconnector: INFO
